services:
   mongo:
      image: mongo:7.0
      container_name: habitpulse-mongo
      ports:
         - "27017:27017"
      volumes:
         - mongo_data:/data/db

   server:
      build: ./packages/server
      container_name: habitpulse-server
      ports:
         - "5000:5000"
      environment:
         - PORT=5000
         - MONGO_URI=mongodb://mongo:27017/habit_tracker
         - JWT_SECRET=habitpulse-dev-secret-key-123
         - CLIENT_URL=http://localhost:5173
      depends_on:
         - mongo

   client:
      build: ./packages/client
      container_name: habitpulse-client
      ports:
         - "5173:5173"
      environment:
         - VITE_PROXY_TARGET=http://server:5000
      depends_on:
         - server

volumes:
   mongo_data:
